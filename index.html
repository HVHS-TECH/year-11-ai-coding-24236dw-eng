<!DOCTYPE html>
<html>
<head>
<title>WWE Wrestling Game</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    font-family: Arial, sans-serif;
  }
  
  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  
  canvas {
    border: 3px solid #FFD700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    cursor: crosshair;
  }
  
  .controls {
    color: white;
    text-align: center;
    max-width: 800px;
  }
  
  .controls h1 {
    margin: 0 0 10px 0;
    color: #FFD700;
  }
  
  .controls p {
    margin: 5px 0;
    font-size: 14px;
  }
  
  .player-controls {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-top: 10px;
  }
  
  .player-info {
    color: white;
  }
  
  .player-info h3 {
    margin: 0;
    color: #FFD700;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div class="controls">
    <h1>🎮 WWE WRESTLING GAME 🎮</h1>
    <div class="player-controls">
      <div class="player-info">
        <h3>Player 1 (Red)</h3>
        <p>A/D - Move | W - Jump | S - Block | G - Punch | Q - Kick</p>
      </div>
      <div class="player-info">
        <h3>Player 2 (Blue)</h3>
        <p>← / → - Move | ↑ - Jump | ↓ - Block | L - Punch | P - Kick</p>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
